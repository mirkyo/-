# 知微 · 全部依赖跑在 Docker 里（MySQL + pgvector），可选把应用自己也容器化
#
# 常用命令：
#   docker compose up -d                    只起依赖（MySQL 3306 / pgvector 5433），应用在本机跑
#   docker compose --profile app up -d --build   连应用一起起（应用 8088）
#   docker compose logs -f mysql            看 MySQL 初始化日志
#   docker compose down                     停掉（数据卷保留）
#   docker compose down -v                  停掉并**删除数据**（重建库时用）
#
# 首次启动时 MySQL 会自动执行 src/main/resources/db/schema-mysql.sql 建表。
# ⚠️ 那个脚本只在**数据卷为空**时执行一次；改了表结构要 down -v 再 up。

name: ziwei

services:
  # ==================== MySQL 8.0（业务表 + 框架会话表） ====================
  mysql:
    image: mysql:8.0
    container_name: zw-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --lower-case-table-names=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ziwei_kb
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - zw-mysql-data:/var/lib/mysql
      # 首次初始化自动建库建表（脚本内已含 CREATE DATABASE IF NOT EXISTS）
      - ./src/main/resources/db/schema-mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ==================== 应用（可选：带 --profile app 才启动） ====================
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: zw-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 容器内走服务名，不是 localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      # 向量库改用本机 Qdrant（不走容器），host.docker.internal 指回宿主机
      ZW_VECTOR_STORE: qdrant
      QDRANT_HOST: host.docker.internal
      QDRANT_PORT: 6334
      QDRANT_API_KEY: ${QDRANT_API_KEY:?请在 .env 里设置 QDRANT_API_KEY}
      # 所有 key / token 只从 .env（或系统环境变量）注入，yml 里一律留空
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_EMBEDDING_API_KEY: ${DASHSCOPE_EMBEDDING_API_KEY:-}
      DASHSCOPE_VL_API_KEY: ${DASHSCOPE_VL_API_KEY:-}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-8088}:8088"
    volumes:
      # 技能目录持久化（zip 上传的技能不会因为重建容器丢失）
      - ./data/skills:/app/data/skills

volumes:
  zw-mysql-data:
    name: ziwei-mysql-data
