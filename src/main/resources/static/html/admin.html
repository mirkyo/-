<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知微 · 管理</title>
<link rel="stylesheet" href="../css/zw.css?v=20261021A">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gstar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285f4"/><stop offset="48%" stop-color="#9b72cb"/><stop offset="100%" stop-color="#d96570"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <aside class="side" id="side">
    <div class="side-hd">
      <button class="iconbtn" id="btn-collapse"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg></button>
    </div>
    <div class="brand">
      <svg class="star" viewBox="0 0 24 24"><path fill="url(#gstar)" d="M12 1.8c.62 5 3.3 7.68 8.3 8.3-5 .62-7.68 3.3-8.3 8.3-.62-5-3.3-7.68-8.3-8.3 5-.62 7.68-3.3 8.3-8.3z"/></svg>
      <span class="grad" style="font-weight:500">知微</span>
    </div>
    <div class="side-scroll" id="nav"></div>
    <div class="side-ft">
      <button class="userrow"><span class="avatar" id="user-avatar">?</span><span style="flex:1;text-align:left" id="user-name">-</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="iconbtn" id="btn-collapse-2"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg></button>
      <button class="model">
        <svg class="star" viewBox="0 0 24 24"><path fill="url(#gstar)" d="M12 1.8c.62 5 3.3 7.68 8.3 8.3-5 .62-7.68 3.3-8.3 8.3-.62-5-3.3-7.68-8.3-8.3 5-.62 7.68-3.3 8.3-8.3z"/></svg>
        <span class="grad" style="font-weight:500">管理</span>
      </button>
      <div class="topbar-right">
        <button class="iconbtn" id="btn-theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </div>

    <div class="page scroll" style="overflow-y:auto">
      <div class="page-inner">
        <div class="page-hd"><h2>管理</h2></div>
        <div class="page-desc" id="scope-desc"></div>

        <div id="panel-user">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
            <div style="font-size:15px;font-weight:500">用户列表</div>
            <button class="btn solid sm" id="btn-add-user" style="margin-left:auto">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              新建用户
            </button>
          </div>
          <table class="tbl">
            <thead><tr><th style="width:26%">用户名</th><th>昵称</th><th>角色</th><th>状态</th><th>最近登录</th><th style="width:120px"></th></tr></thead>
            <tbody id="user-table"></tbody>
          </table>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="../js/zw-common.js?v=20261021A"></script>
<script src="../js/zw-ui.js?v=20261021A"></script>
<script src="../js/admin.js?v=20261021A"></script>
</body>
</html>
