<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知微 · 对话</title>
<link rel="stylesheet" href="../css/zw.css?v=20261021A">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<style>
  /* 让多选下拉在顶栏里对齐 */
  .topbar-right .ms { display: inline-block; }
  /* 输入框工具条：照 ChatGPT —— 圆形加号 + 幽灵 chip + 纯文字模型名，都没有填充背景 */
  .bar { gap: 6px; }
  .upload-wrap { position: relative; display: inline-flex; width: 30px; height: 30px; }
  .upload-wrap .rbtn { pointer-events: none; }
  .upload-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; font-size: 0; border: 0; padding: 0;
  }
  .bar .rbtn {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 1px solid var(--line); background: transparent; color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .bar .rbtn:hover { background: var(--bg-hover); color: var(--text); }
  .bar .scope-inline { display: inline-flex; align-items: center; }
  .bar .scope-inline .ms { display: inline-block; }
  .bar .scope-inline .ms-btn {
    height: 30px; padding: 0 8px; border: none; background: transparent;
    border-radius: 8px; font-size: 13px; color: var(--text-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .bar .scope-inline .ms-btn:hover { background: var(--bg-hover); color: var(--text); }
  .bar .scope-inline .ms-ic { display: inline-flex; }
  .bar .model-picker .rbtn.wide {
    width: auto; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px;
    background: transparent; font-size: 13px; color: var(--text-2);
  }
  .bar .model-picker .rbtn.wide:hover { background: var(--bg-hover); color: var(--text); }
</style>
</head>
<body class="chat-empty">
<script>
  // 登录闸门（内联，先于所有外部脚本）：无 token / 已过期 / 无用户信息 → 回登录页
  // 直接解 JWT 的 exp 判断，不依赖任何网络请求和外部 js
  function zwTokenValid(t) {
    if (!t) return false;
    try {
      var s = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var p = JSON.parse(decodeURIComponent(escape(atob(s))));
      return !!(p && p.exp && p.exp * 1000 > Date.now() + 5000);
    } catch (e) { return false; }
  }
  (function () {
    try {
      var t = localStorage.getItem('zw-token');
      var u = localStorage.getItem('zw-user');
      if (!zwTokenValid(t) || !u) {
        localStorage.removeItem('zw-token');
        localStorage.removeItem('zw-user');
        location.replace('login.html');
      }
    } catch (e) { location.replace('login.html'); }
  })();
</script>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gstar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285f4"/><stop offset="48%" stop-color="#9b72cb"/><stop offset="100%" stop-color="#d96570"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <!-- ==================== 侧栏（导航 + 最近会话常驻） ==================== -->
  <aside class="side" id="side">
    <div class="side-hd">
      <button class="iconbtn" id="btn-collapse" title="收起侧栏">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg>
      </button>
      <button class="iconbtn" id="btn-logout" title="退出登录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>

    <div class="brand">
      <svg class="star" viewBox="0 0 24 24"><path fill="url(#gstar)" d="M12 1.8c.62 5 3.3 7.68 8.3 8.3-5 .62-7.68 3.3-8.3 8.3-.62-5-3.3-7.68-8.3-8.3 5-.62 7.68-3.3 8.3-8.3z"/></svg>
      <span class="grad" style="font-weight:500">知微</span>
    </div>

    <!-- 新对话 + 导航 + 最近会话，全部由 Nav 渲染（各页一致） -->
    <div class="side-scroll" id="nav"></div>

    <div class="side-ft">
      <button class="userrow" id="user-row">
        <span class="avatar" id="user-avatar">?</span>
        <span style="flex:1;text-align:left" id="user-name">未登录</span>
      </button>
    </div>
  </aside>

  <!-- ==================== 主区 ==================== -->
  <main class="main">
    <div class="topbar">
      <button class="iconbtn" id="btn-collapse-2" title="侧栏">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg>
      </button>

      <button class="model">
        <svg class="star" viewBox="0 0 24 24"><path fill="url(#gstar)" d="M12 1.8c.62 5 3.3 7.68 8.3 8.3-5 .62-7.68 3.3-8.3 8.3-.62-5-3.3-7.68-8.3-8.3 5-.62 7.68-3.3 8.3-8.3z"/></svg>
        <span class="grad" style="font-weight:500">知微助手</span>
      </button>

      <div class="topbar-right">
        <button class="iconbtn" id="btn-theme" title="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread"></div>
    </div>
    <button type="button" class="to-bottom" id="to-bottom" hidden title="回到底部">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
    </button>

    <div class="hello-slot" id="hello-slot">
      <div class="hello">
        <svg viewBox="0 0 24 24" style="width:40px;height:40px;margin-bottom:16px"><path fill="url(#gstar)" d="M12 1.8c.62 5 3.3 7.68 8.3 8.3-5 .62-7.68 3.3-8.3 8.3-.62-5-3.3-7.68-8.3-8.3 5-.62 7.68-3.3 8.3-8.3z"/></svg>
        <h1><span class="grad">有什么可以帮你的？</span></h1>
        <div class="sub">先在「知识库」里放几份文档，然后直接问</div>
      </div>
    </div>
    <div class="composer-wrap">
      <div class="composer">
        <div class="box">
          <div class="att-chips" id="att-chips" hidden></div>
          <textarea id="input" rows="1" placeholder="询问任何问题"></textarea>

          <div class="bar">
            <!-- 透明 file input 直接盖在 ＋ 上：点哪都命中 input，浏览器原生弹选择框 -->
            <span class="upload-wrap" title="上传文件（本轮对话使用）">
              <span class="rbtn" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              </span>
              <input type="file" id="file-input" class="upload-input" multiple
                     accept=".txt,.md,.markdown,.csv,.tsv,.json,.xml,.html,.htm,.log,.yml,.yaml,.properties,.ini,.conf,.sql,.java,.js,.ts,.py,.go,.rs,.c,.cpp,.h,.cs,.php,.rb,.sh,.pdf,.docx,.doc,.pptx,.ppt,.xlsx,.xls,.rtf,.jpg,.jpeg,.png,.webp,.gif,.bmp">
            </span>
            <div class="kb-picker" id="kb-picker">
              <button class="kb-btn" id="kb-btn" type="button" title="选择知识库（可不选）">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                <span id="kb-label">知识库</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="kb-menu" id="kb-menu" hidden>
                <div class="kb-list" id="kb-list"></div>
                <div class="kb-foot">
                  <button type="button" id="kb-all">全选</button>
                  <button type="button" id="kb-done">完成</button>
                </div>
              </div>
            </div>
            <div class="model-picker" id="model-picker">
              <button class="rbtn wide" id="model-btn" type="button" title="选择模型">
                <span id="model-cur">Opus 5.5</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="model-menu" id="model-menu" hidden></div>
            </div>

            <div class="bar-right">
              <button class="rbtn" id="btn-stop" title="停止生成" style="display:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
              </button>
              <button class="send" id="btn-send">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="tip">回答基于你上传的文档生成，可点击角标 [1] 跳到下方来源卡片。</div>
      </div>
    </div>
  </main>
</div>

<script src="../js/zw-common.js?v=20261021A"></script>
<script src="../js/zw-ui.js?v=20261021A"></script>
<script src="../js/chat.js?v=20261021A"></script>
</body>
</html>
